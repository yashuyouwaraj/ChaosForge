services:

  backend:
    build: ./backend

    profiles:
      - app

    restart: unless-stopped

    ports:
      - "3001:3001"

    environment:
      NODE_ENV: production

      PORT: 3001

      FRONTEND_URL: http://localhost:3000

      CORS_ORIGIN: http://localhost:3000

      MONGO_URI: mongodb://mongo:27017/chaosforge

      REDIS_URL: redis://redis:6379

      KAFKA_BROKER: kafka:9092

      KAFKA_TOPIC_REPLICATION_FACTOR: 1

      USE_KAFKA: "true"

    depends_on:
      - redis
      - kafka
      - mongo

  worker:
    build: ./backend

    profiles:
      - app

    restart: unless-stopped

    command: npm run worker

    environment:
      NODE_ENV: production

      MONGO_URI: mongodb://mongo:27017/chaosforge

      REDIS_URL: redis://redis:6379

      KAFKA_BROKER: kafka:9092

      KAFKA_TOPIC_REPLICATION_FACTOR: 1

      USE_KAFKA: "true"

    depends_on:
      - redis
      - kafka
      - mongo

  frontend:
    build: ./frontend

    profiles:
      - app

    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001

      NEXT_PUBLIC_SOCKET_URL: http://backend:3001

    ports:
      - "3000:3000"

    depends_on:
      - backend

  redis:
    image: redis:7

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka:latest

    restart: unless-stopped

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_NODE_ID: 1

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  mongo:
    image: mongo:7

    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

  prometheus:
    image: prom/prometheus

    restart: unless-stopped

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        sed \
          -e "s|__PROMETHEUS_BACKEND_SCHEME__|$${PROMETHEUS_BACKEND_SCHEME}|g" \
          -e "s|__PROMETHEUS_BACKEND_TARGET__|$${PROMETHEUS_BACKEND_TARGET}|g" \
          /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.console.libraries=/usr/share/prometheus/console_libraries \
          --web.console.templates=/usr/share/prometheus/consoles

    environment:
      PROMETHEUS_BACKEND_SCHEME: ${PROMETHEUS_BACKEND_SCHEME:-http}

      PROMETHEUS_BACKEND_TARGET: ${PROMETHEUS_BACKEND_TARGET:-host.docker.internal:3001}

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana

    restart: unless-stopped

    ports:
      - "5000:3000"

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus

volumes:
  mongo-data:

  redis-data:

  grafana-data:

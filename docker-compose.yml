services:

  backend:
    build: ./backend
    ports:
      - "5000:5000"

    environment:
      NODE_ENV: production
      PORT: 5000

      MONGO_URI: mongodb://mongo:27017/chaosforge

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BROKER: kafka:9092

      USE_KAFKA: "true"

    depends_on:
      - redis
      - kafka
      - mongo

  worker:
    build: ./backend

    command: npm run worker

    environment:
      NODE_ENV: production

      MONGO_URI: mongodb://mongo:27017/chaosforge

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BROKER: kafka:9092

      USE_KAFKA: "true"

    depends_on:
      - redis
      - kafka
      - mongo

  frontend:
    build: ./frontend

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000

    ports:
      - "3000:3000"

    depends_on:
      - backend

  redis:
    image: redis:7

    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:latest

    ports:
      - "9092:9092"

    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  mongo:
    image: mongo:7

    ports:
      - "27017:27017"